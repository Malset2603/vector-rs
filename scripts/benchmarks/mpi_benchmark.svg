<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" style="background-color: #181824; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
