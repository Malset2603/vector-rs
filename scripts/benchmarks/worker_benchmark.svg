<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" style="background-color: #181824; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Subtle Glow Filter for Line Strokes -->
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vertical Alpha Mask for Area Shading Fade to Baseline -->
    <linearGradient id="vMaskGrad" x1="0" y1="155.0" x2="0" y2="465.0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <mask id="workerAreaMask">
      <rect x="0" y="135.0" width="1060" height="350.0" fill="url(#vMaskGrad)" />
    </mask>

    <!-- Worker Horizontal Multi-Color Gradient (Worker 1 -> Worker Max) -->
    <linearGradient id="workerGrad" x1="175.0" y1="0" x2="895.0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.0%" stop-color="#82aaff" />
      <stop offset="100.0%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="530.0" y="40" text-anchor="middle" fill="#f8f8f2" font-size="21" font-weight="bold">VectorRS: Distributed gRPC Scatter-Gather Search Scaling</text>
  <text x="530.0" y="66" text-anchor="middle" fill="#9d9eb4" font-size="12.5">Async Sharded Query Latency &amp; Cluster Throughput vs. Worker Nodes (Metric: Cosine Similarity, N=1,000, D=64, Samples=10)</text>

  <!-- Y-Axis Title (Rotated) -->
  <text transform="rotate(-90)" x="-310.0" y="28" text-anchor="middle" fill="#bd93f9" font-size="12" font-weight="600" letter-spacing="0.5px">Average Cluster Search Throughput (Higher is Better)</text>

  <!-- Y-Axis Gridlines & Labels (Formatted in 'k' QPS) -->
  <line x1="110.0" y1="465.0" x2="960.0" y2="465.0" stroke="#44475a" stroke-width="1.5" />
  <line x1="110.0" y1="413.3" x2="960.0" y2="413.3" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="361.7" x2="960.0" y2="361.7" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="310.0" x2="960.0" y2="310.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="258.3" x2="960.0" y2="258.3" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="206.7" x2="960.0" y2="206.7" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="155.0" x2="960.0" y2="155.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <text x="98.0" y="469.0" text-anchor="end" fill="#6272a4" font-size="12">0 QPS</text>
  <text x="98.0" y="417.3" text-anchor="end" fill="#6272a4" font-size="12">250 QPS</text>
  <text x="98.0" y="365.7" text-anchor="end" fill="#6272a4" font-size="12">500 QPS</text>
  <text x="98.0" y="314.0" text-anchor="end" fill="#6272a4" font-size="12">750 QPS</text>
  <text x="98.0" y="262.3" text-anchor="end" fill="#6272a4" font-size="12">1k QPS</text>
  <text x="98.0" y="210.7" text-anchor="end" fill="#6272a4" font-size="12">1.2k QPS</text>
  <text x="98.0" y="159.0" text-anchor="end" fill="#6272a4" font-size="12">1.5k QPS</text>

  <!-- Area Shading with 2D Gradient Fade -->
  <!-- Multi-Color Gradient Area Shading with Vertical Fade Mask -->
  <path d="M 175.0 465.0 L 175.0 258.1 L 895.0 298.6 L 895.0 465.0 Z" fill="url(#workerGrad)" mask="url(#workerAreaMask)" />

  <!-- Multi-Color Gradient Line Stroke -->
  <!-- Multi-Color Gradient Line Stroke with Glow -->
  <path d="M 175.0 258.1 L 895.0 298.6" fill="none" stroke="url(#workerGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#lineGlow)" />
  <path d="M 175.0 258.1 L 895.0 298.6" fill="none" stroke="url(#workerGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node Markers & Annotations -->
  <!-- Node 1 Worker -->
  <line x1="175.0" y1="465.0" x2="175.0" y2="258.1" stroke="#44475a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45" />
  <circle cx="175.0" cy="258.1" r="8.5" fill="#82aaff" opacity="0.25" />
  <circle cx="175.0" cy="258.1" r="5.0" fill="#181824" stroke="#82aaff" stroke-width="2.8" />
  <text x="175.0" y="248.1" text-anchor="middle" fill="#82aaff" font-size="12" font-weight="bold">1,001 QPS</text>
  <text x="175.0" y="232.1" text-anchor="middle" fill="#9d9eb4" font-size="11" font-weight="bold">1-Node (Baseline)</text>
  <text x="175.0" y="487.0" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="bold">1 Worker</text>
  <text x="175.0" y="503.0" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="600">1.0 ms (1,000 vec/node)</text>
  <!-- Node 2 Workers -->
  <line x1="895.0" y1="465.0" x2="895.0" y2="298.6" stroke="#44475a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45" />
  <circle cx="895.0" cy="298.6" r="8.5" fill="#a78bfa" opacity="0.25" />
  <circle cx="895.0" cy="298.6" r="5.0" fill="#181824" stroke="#a78bfa" stroke-width="2.8" />
  <text x="895.0" y="288.6" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">805 QPS</text>
  <text x="895.0" y="272.6" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">0.80x Faster</text>
  <text x="895.0" y="487.0" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="bold">2 Workers</text>
  <text x="895.0" y="503.0" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">1.2 ms (500 vec/node)</text>

  <!-- X-Axis Title -->
  <text x="530.0" y="529.0" text-anchor="middle" fill="#bd93f9" font-size="11.5" font-weight="600" letter-spacing="0.5px">Distributed Shard Partitions &amp; gRPC Worker Nodes (Tonic Async Fan-Out)</text>

  <!-- Global Footer -->
  <text x="530.0" y="605" text-anchor="middle" fill="#6272a4" font-size="11.5">Distributed Vector Search Suite | Tokio Async Scatter-Gather Fan-out &amp; Top-K Merge Aggregator (gRPC)</text>
</svg>
