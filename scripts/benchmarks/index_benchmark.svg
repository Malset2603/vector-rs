  <path d="M 175.0 228.2 L 415.0 294.0 L 655.0 321.8 L 895.0 333.5" fill="none" stroke="url(#hnswGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#lineGlow)" />
