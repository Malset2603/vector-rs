<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 980" style="background-color: #181824; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Subtle Glow Filter for Line Strokes -->
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vertical Alpha Masks for Area Shading Fade to Baseline -->
    <linearGradient id="vMaskGrad1" x1="0" y1="155.0" x2="0" y2="395.0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="vMaskGrad2" x1="0" y1="575.0" x2="0" y2="815.0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <mask id="hnswAreaMask">
      <rect x="0" y="135.0" width="1060" height="280.0" fill="url(#vMaskGrad1)" />
    </mask>

    <mask id="ivfAreaMask">
      <rect x="0" y="555.0" width="1060" height="280.0" fill="url(#vMaskGrad2)" />
    </mask>

    <!-- HNSW Horizontal Multi-Color Gradient (Core 1 -> Core Max) -->
    <linearGradient id="hnswGrad" x1="175.0" y1="0" x2="895.0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.0%" stop-color="#82aaff" />
      <stop offset="33.3%" stop-color="#a78bfa" />
      <stop offset="66.7%" stop-color="#c084fc" />
      <stop offset="100.0%" stop-color="#e879f9" />
    </linearGradient>

    <!-- IVF-PQ Horizontal Multi-Color Gradient (Core 1 -> Core Max) -->
    <linearGradient id="ivfGrad" x1="175.0" y1="0" x2="895.0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.0%" stop-color="#ffb86c" />
      <stop offset="33.3%" stop-color="#38bdf8" />
      <stop offset="66.7%" stop-color="#2dd4bf" />
      <stop offset="100.0%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Main Title & Subtitle -->
  <text x="530.0" y="40" text-anchor="middle" fill="#f8f8f2" font-size="21" font-weight="bold">VectorRS: ANN Index Construction Scaling Benchmark</text>
  <text x="530.0" y="66" text-anchor="middle" fill="#9d9eb4" font-size="12.5">Rayon Multi-Core Strong Scaling Benchmark (Metric: Cosine Similarity, N=10,000 Vectors, D=768, Samples=100)</text>

  <!-- ======================================================================== -->
  <!-- SUBPLOT 1: HNSW GRAPH CONSTRUCTION (TOP LINE PLOT) -->
  <!-- ======================================================================== -->
  <g>
    <!-- Subplot 1 Header -->
    <text x="530.0" y="112" text-anchor="middle" fill="#bd93f9" font-size="15" font-weight="bold">HNSW Graph Index Construction (Hierarchical Proximity Graphs)</text>
    <text x="530.0" y="132" text-anchor="middle" fill="#9d9eb4" font-size="11.5">Multi-Thread Scaling (M=16, ef_construction=100, ef_search=50)</text>

    <!-- Subplot 1 Y-Axis Title (Rotated) -->
    <text transform="rotate(-90)" x="-275.0" y="28" text-anchor="middle" fill="#bd93f9" font-size="12" font-weight="600" letter-spacing="0.5px">Average HNSW Build Time (Seconds) [Lower is Better]</text>

    <!-- Subplot 1 Gridlines & Labels -->
  <line x1="110.0" y1="395.0" x2="960.0" y2="395.0" stroke="#44475a" stroke-width="1.5" />
  <line x1="110.0" y1="365.0" x2="960.0" y2="365.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="335.0" x2="960.0" y2="335.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="305.0" x2="960.0" y2="305.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="275.0" x2="960.0" y2="275.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="245.0" x2="960.0" y2="245.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="215.0" x2="960.0" y2="215.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="185.0" x2="960.0" y2="185.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="155.0" x2="960.0" y2="155.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <text x="98.0" y="399.0" text-anchor="end" fill="#6272a4" font-size="12">0s</text>
  <text x="98.0" y="369.0" text-anchor="end" fill="#6272a4" font-size="12">5s</text>
  <text x="98.0" y="339.0" text-anchor="end" fill="#6272a4" font-size="12">10s</text>
  <text x="98.0" y="309.0" text-anchor="end" fill="#6272a4" font-size="12">15s</text>
  <text x="98.0" y="279.0" text-anchor="end" fill="#6272a4" font-size="12">20s</text>
  <text x="98.0" y="249.0" text-anchor="end" fill="#6272a4" font-size="12">25s</text>
  <text x="98.0" y="219.0" text-anchor="end" fill="#6272a4" font-size="12">30s</text>
  <text x="98.0" y="189.0" text-anchor="end" fill="#6272a4" font-size="12">35s</text>
  <text x="98.0" y="159.0" text-anchor="end" fill="#6272a4" font-size="12">40s</text>

    <!-- Subplot 1 Area Shading -->
  <!-- HNSW Multi-Color Gradient Area Shading with Vertical Fade Mask -->
  <path d="M 175.0 395.0 L 175.0 228.2 L 415.0 294.0 L 655.0 321.8 L 895.0 333.5 L 895.0 395.0 Z" fill="url(#hnswGrad)" mask="url(#hnswAreaMask)" />

