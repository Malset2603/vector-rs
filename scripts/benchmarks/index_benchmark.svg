  <circle cx="175.0" cy="228.2" r="5.0" fill="#181824" stroke="#82aaff" stroke-width="2.8" />
  <text x="175.0" y="218.2" text-anchor="middle" fill="#82aaff" font-size="12" font-weight="bold">27.792s</text>
  <text x="175.0" y="202.2" text-anchor="middle" fill="#9d9eb4" font-size="11" font-weight="bold">1-Thread (Baseline)</text>
  <text x="175.0" y="417.0" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="bold">1 Core</text>
  <text x="175.0" y="433.0" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="600">Sequential (1-Thread)</text>
  <!-- HNSW Node 2 Cores -->
