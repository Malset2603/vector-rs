  <text x="655.0" y="433.0" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">Parallel (Rayon)</text>
  <!-- HNSW Node 8 Cores -->
  <line x1="895.0" y1="395.0" x2="895.0" y2="333.5" stroke="#44475a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45" />
  <circle cx="895.0" cy="333.5" r="8.5" fill="#e879f9" opacity="0.25" />
  <circle cx="895.0" cy="333.5" r="5.0" fill="#181824" stroke="#e879f9" stroke-width="2.8" />
  <text x="895.0" y="323.5" text-anchor="middle" fill="#e879f9" font-size="12" font-weight="bold">10.250s</text>
  <text x="895.0" y="307.5" text-anchor="middle" fill="#e879f9" font-size="11" font-weight="bold">2.71x Faster</text>
  <text x="895.0" y="417.0" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="bold">8 Cores</text>
  <text x="895.0" y="433.0" text-anchor="middle" fill="#e879f9" font-size="11" font-weight="600">Parallel (Rayon)</text>

    <!-- Subplot 1 X-Axis Title -->
    <text x="530.0" y="455.0" text-anchor="middle" fill="#bd93f9" font-size="11.5" font-weight="600" letter-spacing="0.5px">CPU Core Allocation &amp; Rayon Thread Concurrency</text>
  </g>

