    <text x="530.0" y="552" text-anchor="middle" fill="#9d9eb4" font-size="11.5">Multi-Thread Scaling (nlist=32 coarse Voronoi partitions, M=4 sub-vectors, K=64 sub-clusters)</text>

    <!-- Subplot 2 Y-Axis Title (Rotated) -->
    <text transform="rotate(-90)" x="-695.0" y="28" text-anchor="middle" fill="#bd93f9" font-size="12" font-weight="600" letter-spacing="0.5px">Average IVF-PQ Build Time (Seconds) [Lower is Better]</text>

    <!-- Subplot 2 Gridlines & Labels -->
  <line x1="110.0" y1="815.0" x2="960.0" y2="815.0" stroke="#44475a" stroke-width="1.5" />
  <line x1="110.0" y1="780.7" x2="960.0" y2="780.7" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="746.4" x2="960.0" y2="746.4" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
