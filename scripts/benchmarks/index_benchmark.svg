  <text x="415.0" y="268.0" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">1.65x Faster</text>
  <text x="415.0" y="417.0" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="bold">2 Cores</text>
  <text x="415.0" y="433.0" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">Parallel (Rayon)</text>
  <!-- HNSW Node 4 Cores -->
  <line x1="655.0" y1="395.0" x2="655.0" y2="321.8" stroke="#44475a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45" />
  <circle cx="655.0" cy="321.8" r="8.5" fill="#c084fc" opacity="0.25" />
