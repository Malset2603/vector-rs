<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 980" style="background-color: #181824; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Subtle Glow Filter for Line Strokes -->
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vertical Alpha Masks for Area Shading Fade to Baseline -->
    <linearGradient id="vMaskGrad1" x1="0" y1="155.0" x2="0" y2="395.0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="vMaskGrad2" x1="0" y1="575.0" x2="0" y2="815.0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <mask id="hnswAreaMask">
      <rect x="0" y="135.0" width="1060" height="280.0" fill="url(#vMaskGrad1)" />
    </mask>

    <mask id="ivfAreaMask">
      <rect x="0" y="555.0" width="1060" height="280.0" fill="url(#vMaskGrad2)" />
    </mask>

    <!-- HNSW Horizontal Multi-Color Gradient -->
    <linearGradient id="hnswGrad" x1="175.0" y1="0" x2="895.0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.0%" stop-color="#82aaff" />
      <stop offset="25.0%" stop-color="#a78bfa" />
      <stop offset="50.0%" stop-color="#c084fc" />
      <stop offset="75.0%" stop-color="#e879f9" />
      <stop offset="100.0%" stop-color="#f472b6" />
    </linearGradient>

    <!-- IVF-PQ Horizontal Multi-Color Gradient -->
    <linearGradient id="ivfGrad" x1="175.0" y1="0" x2="895.0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.0%" stop-color="#ffb86c" />
      <stop offset="25.0%" stop-color="#38bdf8" />
      <stop offset="50.0%" stop-color="#2dd4bf" />
      <stop offset="75.0%" stop-color="#34d399" />
      <stop offset="100.0%" stop-color="#a3e635" />
    </linearGradient>
  </defs>

  <!-- Main Title & Subtitle -->
  <text x="530.0" y="40" text-anchor="middle" fill="#f8f8f2" font-size="21" font-weight="bold">VectorRS: Approximate Nearest Neighbor (ANN) Query Search Benchmark</text>
  <text x="530.0" y="66" text-anchor="middle" fill="#9d9eb4" font-size="12.5">ANN Search Latency vs. Flat Exact Brute-Force Baseline (Metric: Cosine Similarity, N=10,000 Vectors, D=768, Top-K=10, Samples=100)</text>

  <!-- ======================================================================== -->
  <!-- SUBPLOT 1: HNSW GRAPH QUERY SEARCH (TOP LINE PLOT) -->
  <!-- ======================================================================== -->
  <g>
    <!-- Subplot 1 Header -->
    <text x="530.0" y="112" text-anchor="middle" fill="#bd93f9" font-size="15" font-weight="bold">HNSW Graph Query Search Latency (Hierarchical Proximity Traversal)</text>
    <text x="530.0" y="132" text-anchor="middle" fill="#9d9eb4" font-size="11.5">Candidate Queue Size ef_search Scaling (M=16, ef_construction=100)</text>

    <!-- Subplot 1 Y-Axis Title (Rotated) -->
    <text transform="rotate(-90)" x="-275.0" y="28" text-anchor="middle" fill="#bd93f9" font-size="12" font-weight="600" letter-spacing="0.5px">Average HNSW Search Latency (Lower is Better)</text>

    <!-- Subplot 1 Gridlines & Labels -->
  <line x1="110.0" y1="395.0" x2="960.0" y2="395.0" stroke="#44475a" stroke-width="1.5" />
  <line x1="110.0" y1="355.0" x2="960.0" y2="355.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="315.0" x2="960.0" y2="315.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
