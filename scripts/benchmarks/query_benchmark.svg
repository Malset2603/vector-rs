  <path d="M 175.0 365.5 L 355.0 349.2 L 535.0 315.3 L 715.0 254.0 L 895.0 205.4" fill="none" stroke="url(#hnswGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#lineGlow)" />
