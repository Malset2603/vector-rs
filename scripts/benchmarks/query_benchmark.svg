  <line x1="110.0" y1="235.0" x2="960.0" y2="235.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="195.0" x2="960.0" y2="195.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="110.0" y1="155.0" x2="960.0" y2="155.0" stroke="#44475a" stroke-width="1" stroke-dasharray="4,4" />
  <text x="98.0" y="399.0" text-anchor="end" fill="#6272a4" font-size="12">0 µs</text>
  <text x="98.0" y="359.0" text-anchor="end" fill="#6272a4" font-size="12">25 µs</text>
  <text x="98.0" y="319.0" text-anchor="end" fill="#6272a4" font-size="12">50 µs</text>
  <text x="98.0" y="279.0" text-anchor="end" fill="#6272a4" font-size="12">75 µs</text>
  <text x="98.0" y="239.0" text-anchor="end" fill="#6272a4" font-size="12">100 µs</text>
  <text x="98.0" y="199.0" text-anchor="end" fill="#6272a4" font-size="12">125 µs</text>
  <text x="98.0" y="159.0" text-anchor="end" fill="#6272a4" font-size="12">150 µs</text>

    <!-- Subplot 1 Flat Baseline Reference Line -->
  <line x1="110.0" y1="318.4" x2="960.0" y2="318.4" stroke="#ff5555" stroke-width="2" stroke-dasharray="6,4" opacity="0.85" />
  <text x="952.0" y="311.4" text-anchor="end" fill="#ff5555" font-size="11" font-weight="bold">Single CPU Baseline</text>
  <text x="952.0" y="332.4" text-anchor="end" fill="#ff5555" font-size="10.5" font-weight="600">47.85 µs | 20,899 QPS</text>

    <!-- Subplot 1 Area Shading -->
  <!-- HNSW Multi-Color Gradient Area Shading -->
  <path d="M 175.0 395.0 L 175.0 365.5 L 355.0 349.2 L 535.0 315.3 L 715.0 254.0 L 895.0 205.4 L 895.0 395.0 Z" fill="url(#hnswGrad)" mask="url(#hnswAreaMask)" />

