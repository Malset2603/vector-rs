  <!-- HNSW Node ef = 150 -->
  <line x1="895.0" y1="395.0" x2="895.0" y2="205.4" stroke="#44475a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45" />
  <circle cx="895.0" cy="205.4" r="8.5" fill="#f472b6" opacity="0.25" />
  <circle cx="895.0" cy="205.4" r="5.0" fill="#181824" stroke="#f472b6" stroke-width="2.8" />
  <text x="895.0" y="195.4" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">118.50 µs</text>
  <text x="895.0" y="179.4" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="bold">Recall: 99.9%</text>
  <text x="895.0" y="417.0" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="bold">ef = 150</text>
  <text x="895.0" y="433.0" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="600">8.4k QPS</text>

    <!-- Subplot 1 X-Axis Title -->
    <text x="530.0" y="455.0" text-anchor="middle" fill="#bd93f9" font-size="11.5" font-weight="600" letter-spacing="0.5px">HNSW Search Depth Parameter ef_search (Candidate Queue Size)</text>
  </g>

  <!-- Horizontal Separator Between Subplots with Generous Spacing -->
  <line x1="90.0" y1="480.0" x2="970.0" y2="480.0" stroke="#44475a" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

