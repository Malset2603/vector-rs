  <text x="175.0" y="355.5" text-anchor="middle" fill="#82aaff" font-size="12" font-weight="bold">18.42 µs</text>
  <text x="175.0" y="339.5" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="bold">Recall: 93.8%</text>
