  <text x="952.0" y="716.1" text-anchor="end" fill="#ff5555" font-size="11" font-weight="bold">Single CPU Baseline</text>
  <text x="952.0" y="737.1" text-anchor="end" fill="#ff5555" font-size="10.5" font-weight="600">47.85 µs | 20,899 QPS</text>

